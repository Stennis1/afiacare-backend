<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AfiaCare CHW Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
      min-height: 100vh;
      padding: 1.5rem;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      color: #6fc;
      font-size: 1.4rem;
    }
    .login {
      flex: 1;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      min-width: 300px;
    }
    .login label { color: #aaa; font-size: 0.85rem; }
    .login input {
      flex: 1;
      background: #2a2a3e;
      color: #6fc;
      border: 1px solid #444;
      padding: 0.4rem 0.6rem;
      border-radius: 0.25rem;
      font-family: monospace;
      font-size: 0.75rem;
      min-width: 0;
    }
    button {
      background: #2a8c4a;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.3rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #3a9c5a; }
    button.secondary { background: #3a3a4e; }
    button.secondary:hover { background: #4a4a5e; }
    button.danger { background: #8c2a2a; }
    button.danger:hover { background: #9c3a3a; }
    .meta {
      max-width: 1200px;
      margin: 0 auto 1rem;
      font-size: 0.75rem;
      color: #888;
      font-family: monospace;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    section {
      background: #2a2a3e;
      border-radius: 0.5rem;
      padding: 1.25rem;
      border: 1px solid #3a3a4e;
    }
    section h2 {
      margin: 0 0 1rem;
      color: #6fc;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      background: #3a3a4e;
      color: #aaa;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 0.75rem;
      font-weight: normal;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    thead th {
      text-align: left;
      padding: 0.5rem 0.6rem;
      background: #1a1a2e;
      color: #6fc;
      font-weight: 600;
      border-bottom: 1px solid #444;
    }
    tbody td {
      padding: 0.6rem;
      border-bottom: 1px solid #3a3a4e;
      vertical-align: top;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #32324a; }
    .level {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .level-EMERGENCY { background: #8c2a2a; color: #fff; }
    .level-HIGH { background: #c97a1f; color: #fff; }
    .level-MEDIUM { background: #3a6cb0; color: #fff; }
    .level-LOW { background: #2a8c4a; color: #fff; }
    .status {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .status-OPEN { background: #fc6; color: #1a1a2e; }
    .status-ACKNOWLEDGED { background: #6fc; color: #1a1a2e; }
    .status-RESOLVED { background: #555; color: #ccc; }
    .status-SENT { background: #2a8c4a; color: #fff; }
    .status-QUEUED { background: #3a6cb0; color: #fff; }
    .status-FAILED { background: #8c2a2a; color: #fff; }
    .actions { display: flex; gap: 0.3rem; }
    .actions button { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    .empty {
      color: #888;
      font-style: italic;
      text-align: center;
      padding: 2rem;
    }
    .channel {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .body-cell {
      max-width: 400px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #ccc;
    }
    .reasons {
      font-family: monospace;
      font-size: 0.7rem;
      color: #aaa;
    }
    .err {
      background: #4a1a1a;
      color: #fcc;
      padding: 0.75rem;
      border-radius: 0.25rem;
      margin-bottom: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>AfiaCare CHW Dashboard</h1>
    <div class="login">
      <label>Token</label>
      <input id="token" placeholder="Bearer JWT (login as CHW or ADMIN)" />
      <button onclick="load()">Load</button>
      <button class="secondary" onclick="toggleAuto()" id="autoBtn">Auto-refresh: off</button>
    </div>
  </header>

  <div class="meta" id="meta">Not loaded.</div>

  <div id="err"></div>

  <main>
    <section>
      <h2>Open Alerts <span class="badge" id="alertCount">0</span></h2>
      <div id="alerts"><div class="empty">Paste a CHW/ADMIN token above and click Load.</div></div>
    </section>

    <section>
      <h2>Recent Notifications <span class="badge" id="notifCount">0</span></h2>
      <div id="notifs"><div class="empty">No notifications loaded yet.</div></div>
    </section>
  </main>

  <script>
    var state = { autoInterval: null };

    function $(id) { return document.getElementById(id); }
    function token() { return $('token').value.trim(); }

    function setErr(msg) {
      $('err').innerHTML = msg ? '<div class="err">' + msg + '</div>' : '';
    }

    function fmtTime(iso) {
      if (!iso) return '-';
      var d = new Date(iso);
      var now = Date.now();
      var diff = Math.floor((now - d.getTime()) / 1000);
      if (diff < 60) return diff + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return d.toLocaleString();
    }

    async function api(path, opts) {
      var t = token();
      if (!t) throw new Error('No token. Paste a JWT first.');
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, {
        'Authorization': 'Bearer ' + t,
        'Content-Type': 'application/json'
      });
      var r = await fetch(path, opts);
      var body = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        var msg = (body && body.error && body.error.message) || ('HTTP ' + r.status);
        throw new Error(msg);
      }
      return body;
    }

    function renderAlerts(alerts) {
      $('alertCount').textContent = alerts.length;
      if (alerts.length === 0) {
        $('alerts').innerHTML = '<div class="empty">No open alerts. Trigger a HIGH/EMERGENCY risk check to see one.</div>';
        return;
      }
      var rows = alerts.map(function (a) {
        var p = a.patient || {};
        var ra = a.riskAssessment || {};
        return '<tr>' +
          '<td><span class="level level-' + a.level + '">' + a.level + '</span></td>' +
          '<td><span class="status status-' + a.status + '">' + a.status + '</span></td>' +
          '<td>' + escapeHtml(p.fullName || '(unnamed)') + '<br><span class="channel">' + escapeHtml(p.phone || '-') + '</span></td>' +
          '<td><span class="reasons">' + escapeHtml((ra.reasons || []).join(', ')) + '</span></td>' +
          '<td>' + fmtTime(a.createdAt) + '</td>' +
          '<td class="actions">' +
            (a.status !== 'RESOLVED' ? '<button onclick="act(\'' + a.id + '\', \'acknowledge\')">Ack</button>' : '') +
            (a.status !== 'RESOLVED' ? '<button class="danger" onclick="act(\'' + a.id + '\', \'resolve\')">Resolve</button>' : '') +
          '</td>' +
        '</tr>';
      }).join('');
      $('alerts').innerHTML =
        '<table><thead><tr>' +
        '<th>Level</th><th>Status</th><th>Patient</th><th>Reasons</th><th>Raised</th><th>Actions</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderNotifs(notifs) {
      $('notifCount').textContent = notifs.length;
      if (notifs.length === 0) {
        $('notifs').innerHTML = '<div class="empty">No notifications. Set ESCALATION_CHW_PHONES in .env, then trigger a HIGH/EMERGENCY.</div>';
        return;
      }
      var rows = notifs.map(function (n) {
        return '<tr>' +
          '<td><span class="status status-' + n.status + '">' + n.status + '</span></td>' +
          '<td class="channel">' + n.channel + '</td>' +
          '<td><code>' + escapeHtml(n.to) + '</code></td>' +
          '<td class="body-cell">' + escapeHtml(n.body) + '</td>' +
          '<td>' + fmtTime(n.sentAt || n.createdAt) + '</td>' +
        '</tr>';
      }).join('');
      $('notifs').innerHTML =
        '<table><thead><tr>' +
        '<th>Status</th><th>Ch</th><th>To</th><th>Body</th><th>Sent</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function load() {
      setErr('');
      try {
        var [alertsResp, notifsResp] = await Promise.all([
          api('/api/alerts'),
          api('/api/notifications?limit=20')
        ]);
        renderAlerts(alertsResp.alerts || []);
        renderNotifs(notifsResp.notifications || []);
        $('meta').textContent = 'Loaded ' + new Date().toLocaleTimeString() +
          ' — ' + (alertsResp.alerts || []).length + ' open, ' +
          (notifsResp.notifications || []).length + ' notifications';
      } catch (e) {
        setErr(e.message);
        $('meta').textContent = 'Load failed at ' + new Date().toLocaleTimeString();
      }
    }

    async function act(alertId, action) {
      setErr('');
      try {
        await api('/api/alerts/' + alertId, {
          method: 'PATCH',
          body: JSON.stringify({ action: action })
        });
        await load();
      } catch (e) {
        setErr(action + ' failed: ' + e.message);
      }
    }

    function toggleAuto() {
      if (state.autoInterval) {
        clearInterval(state.autoInterval);
        state.autoInterval = null;
        $('autoBtn').textContent = 'Auto-refresh: off';
      } else {
        if (!token()) { alert('Paste a token first.'); return; }
        load();
        state.autoInterval = setInterval(load, 10000);
        $('autoBtn').textContent = 'Auto-refresh: on (10s)';
      }
    }
  </script>
</body>
</html>
